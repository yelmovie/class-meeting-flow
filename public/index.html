  <body>
    <div id="app"></div>

    <p id="page-announce" class="sr-only" role="status"></p>
    <noscript>
      <p style="margin:2rem;font-size:1.25rem;line-height:1.6;text-align:center">

    <template id="recovery-template">
      <main class="recovery-screen">
        <section class="panel">

          <div class="actions">
            <button class="btn primary" data-reload>새로고침</button>
            <button class="btn secondary" data-export-fallback>기록 파일 내려받기</button>
            <!-- 같은 기록 때문에 새로고침해도 계속 이 화면이 뜰 때 빠져나가는 길 -->
            <button class="btn ghost" data-discard-restart>이 기록을 버리고 새로 시작</button>
          </div>
        </section>
      </main>
