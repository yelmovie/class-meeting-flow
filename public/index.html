<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>학급회의 시간</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app" aria-live="polite"></div>
    <template id="recovery-template">
      <main class="recovery-screen">
        <section class="panel">
          <p class="eyebrow">복구 안내</p>
          <h1>화면을 다시 불러오지 못했어요</h1>
          <p>저장된 회의 자료는 브라우저 안에 남아 있습니다. 새로고침하거나 JSON 백업을 내려받아 복구할 수 있어요.</p>
          <div class="actions">
            <button class="btn primary" data-reload>새로고침</button>
            <button class="btn secondary" data-export-fallback>현재 자료 JSON 저장</button>
          </div>
        </section>
      </main>
    </template>
    <script src="./app.js"></script>
  </body>
</html>
